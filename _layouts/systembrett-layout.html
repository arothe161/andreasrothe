<!DOCTYPE html>
<html lang="{{ page.lang | default: 'de' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
</head>
<body>
  {% include header.html %}

  <!--
    Bewusst KEIN einschränkender Haupt-Container (z.B. .container, .content,
    max-width-Wrapper) wie im normalen default.html-Layout. Das Systembrett
    bringt seinen eigenen Layout-Container mit (volle Breite, eigenes Padding)
    und soll nicht durch Textseiten-Styles eingeengt werden.
  -->
  <main style="width: 100%;">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
