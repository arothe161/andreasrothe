about_heading: "Ich glaube an Führung, die Menschen wachsen lässt."
about_p_1: "Ich habe 15 Jahre Führungserfahrung in sich schnell verändernden Berufsumfeldern in Start-Ups, Scale-Ups und in DAX-Konzernen."
about_p_2: "Dort habe ich viele Teams aufgebaut und produktiv gemacht. Ich habe unzählige Individuen begleitet und weiter entwickelt."
about_p_3: "Meine Arbeit ist geprägt von tiefer Neugier für Menschen, konkreten Ergebnissen und einem klaren Blick auf das Wesentliche."

