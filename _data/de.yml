offers_heading: "Was ich für Sie leisten kann"
offer_1_title: "Executive Coaching"
offer_1_desc: "Vertrauliche Einzelbegleitung für Führungskräfte in herausfordernden Phasen – bei Rollenwechseln, Konflikten oder strategischen Weichenstellungen. Format: 6–12 Sitzungen à 90 Minuten, auch online."
offer_2_title: "Change Management"
offer_2_desc: "Strategische Begleitung von Transformationsprozessen – von der Konzeption bis zur Umsetzung. Ich helfe Ihnen, Wandel als Chance zu gestalten und Ihre Organisation mitzunehmen."
offer_3_title: "Team- & Führungsentwicklung"
offer_3_desc: "Workshops und Entwicklungsprogramme für Führungsteams – von der Diagnose über Teamentwicklung bis zur nachhaltigen Stärkung Ihrer Führungskultur. Maßgeschneidert für Ihren Kontext."

